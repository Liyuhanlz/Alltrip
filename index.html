    <head>

        <style>
            :root {
                /* Latte color theme */
                --cream: #FFF8F0;
                --caramel: #C08552;
                --espresso: #5C3D2E;

                --latte: #F3E3D3;
                --cocoa: #8B5E3C;
                --muted: #A68A7B;
            }
            body {
                background-color:var(--cream);
                color:var(--espresso);
                font-family: 'Nunito', sans-serif;
            }
            h1 {
                text-align: center;
                font-family: 'Fredoka', sans-serif;
                font-size:48px;
            }

            .tab {
                padding: 8px 30px;
                border-radius: 999px;
                color: var(--muted);
                text-decoration: none;
                font-weight:700;
            }
            .tab:hover {
                background-color: var(--latte);
                color: var(--espresso);
            }
            .activate {
                background-color: var(--latte);
                color: var(--cocoa);
            }

    </head>
